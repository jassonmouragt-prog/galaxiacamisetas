services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galaxia
      POSTGRES_USER: galaxia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - galaxia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galaxia -d galaxia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  galaxia_data:
