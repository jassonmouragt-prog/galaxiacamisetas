name: Verificar aplicação
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: galaxia
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: galaxia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galaxia -d galaxia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://galaxia:ci_only_password@localhost:5432/galaxia
      DATABASE_TEST_URL: postgresql://galaxia:ci_only_password@localhost:5432/postgres
      APP_URL: http://localhost:3000
      ADMIN_EMAIL: ci@example.com
      ADMIN_INITIAL_PASSWORD: ci_test_password_123
      E2E_ALLOW_WRITES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
